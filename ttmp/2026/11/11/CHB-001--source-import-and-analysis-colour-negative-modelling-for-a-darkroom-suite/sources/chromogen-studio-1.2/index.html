ows the current print surrounded by six variations, one step away in each primary and secondary direction, plus lighter and darker versions. Opposite tiles are opposite moves, so a cast is fixed by choosing the tile that looks right: a print that is too magenta is fixed by the tile that adds green. Each tile is the same print table read at shifted coordinates, so the tiles are exact and cost no more than the main view.\n\nThe step is set in points:\n\n| Step | Darkroom equivalent |\n|---|---|\n| 2 pt | CC05 |\n| 4 pt | CC10 |\n| 8 pt | CC20 |\n\n> **Try it.** [Open the ring-around](st:show?view=ring). Choose a step, click the tile that looks right, then halve the step and repeat. Two rounds usually settle a frame.\n\n> **Exercise.** On the sample, find the Warmth and Tint that make the stone wall neutral. Then compare with what Auto colour at 100 % does on its own, and explain the difference in terms of colour failure (§10.3).\n"},{"id":"ch3","title":"The paper","order":3,"body":"# The paper\n\nA negative has no fixed contrast and no fixed white. The paper gives it both. Five controls set the paper and the way the print is seen: **Paper**, **Contrast**, **Pre-flash**, **Whites** and **Blacks**. All five are macros, except Whites beyond paper white. The **print window** shows what they do.\n\n## Paper\n\nThe paper is a spectral stock: three layers with their own sensitivities, their own characteristic curves, and their own dyes (§10.4). The Studio carries three, from spektrafilm's profiles:\n\n| Paper | Character |\n|---|---|\n| Kodak Portra Endura | the default; a portrait paper, moderate contrast, soft highlights |\n| Kodak Supra Endura | a general-purpose paper, a little more contrast and saturation |\n| Fujifilm Crystal Archive II | steeper curves in red, a punchier colour rendering |\n\nA new paper changes two things, and both tables are rebuilt:\n\n- **What the paper sees of the negative.** Printing density depends on the paper's sensitivities, so the table from dye amounts to printing density is rebuilt.\n- **What the paper's dyes look like.** The table from paper dye amounts to XYZ is rebuilt.\n\nChanging paper also changes the aim lights, so the grey card still prints neutral.\n\nThe paper's slope is about 2 dye units per unit log H at the grey card, against about 0.5 for a colour negative. The system's contrast is their product, about 1.0 to 1.1 on Portra Endura (§10.4). This is why a negative \"looks flat\" and the print does not.\n\n> **Try it.** Print on [Supra Endura](st:set?paper=kodak_supra_endura), then on [Crystal Archive](st:set?paper=fujifilm_crystal_archive_typeii), then back on [Portra Endura](st:set?paper=kodak_portra_endura). Each is a rebuild; watch the reds and the shadows.\n\n## The print window\n\nThe Studio's histogram is drawn where the print is made: per channel, in paper log exposure $x_k$, after every light-like control. The paper's useful range is shaded on it.\n\nFor Portra Endura's red layer that range runs from −0.50 to +0.68 log H relative to the grey point. It goes from the exposure that first raises density 0.04 above the paper's minimum to the one that reaches 90 % of its maximum. That is about 1.2 log H, or 47 points.\n\n```svg\n<svg viewBox=\"0 0 440 230\" width=\"440\">\n<rect x=\"146.9\" y=\"30\" width=\"163.4\" height=\"160\" class=\"f-fill\"/>\n<line x1=\"50\" y1=\"190\" x2=\"410\" y2=\"190\" class=\"mut\"/>\n<line x1=\"216.2\" y1=\"30\" x2=\"216.2\" y2=\"190\" class=\"hair\" stroke-dasharray=\"3 3\"/>\n<path d=\"M50.0,189.2 L56.9,189.0 L63.8,188.8 L70.8,188.5 L77.7,188.2 L84.6,187.7 L91.5,187.2 L98.5,186.6 L105.4,185.8 L112.3,184.8 L119.2,183.7 L126.2,182.3 L133.1,180.6 L140.0,178.6 L146.9,176.1 L153.8,173.2 L160.8,169.8 L167.7,165.9 L174.6,161.3 L181.5,156.1 L188.5,150.2 L195.4,143.7 L202.3,136.6 L209.2,129.1 L216.2,121.2 L223.1,113.2 L230.0,105.2 L236.9,97.3 L243.8,89.8 L250.8,82.7 L257.7,76.2 L264.6,70.3 L271.5,65.1 L278.5,60.5 L285.4,56.6 L292.3,53.2 L299.2,50.3 L306.2,47.8 L313.1,45.8 L320.0,44.1 L326.9,42.7 L333.8,41.6 L340.8,40.6 L347.7,39.8 L354.6,39.2 L361.5,38.7 L368.5,38.2 L375.4,37.9 L382.3,37.6 L389.2,37.4 L396.2,37.2 L403.1,37.1 L410.0,36.9\" class=\"ink\" fill=\"none\" stroke-width=\"1.6\"/>\n<text x=\"150\" y=\"44\" class=\"mut\" font-size=\"11\">toe: near-whites</text>\n<text x=\"306\" y=\"182\" class=\"mut\" font-size=\"11\" text-anchor=\"end\">shoulder: deep shadows</text>\n<text x=\"216.2\" y=\"206\" class=\"mut\" font-size=\"11\" text-anchor=\"middle\">grey</text>\n<text x=\"230\" y=\"224\" class=\"mut\" font-size=\"11\" text-anchor=\"middle\">paper log H →  (more exposure = darker print)</text>\n<text x=\"40\" y=\"110\" class=\"mut\" font-size=\"11\" text-anchor=\"middle\" transform=\"rotate(-90 40 110)\">paper dye</text>\n</svg>\n```\n\n*Figure 3.1. A paper layer's curve against its exposure. The shaded band is the useful window; illustrative logistic shape.*\n\nThe window has a direction that is easy to get backwards. Little paper exposure means little dye and a bright print, so the left end of the axis holds the print's **highlights**. Much exposure means dense dye and a dark print, so the right end holds its **shadows**. Counts left of the band are highlights the paper will burn out to white; counts right of it are shadows it will block up.\n\n> **Try it.** [Open the print window](st:show?view=window), then make the print [a stop brighter](st:set?exposure=1) and [a stop darker](st:set?exposure=-1). The three histograms slide along the axis together. Then try [a softer paper](st:set?exposure=0&contrast=0.75): the histograms narrow.\n\n## Contrast\n\n**Contrast** stretches or squeezes paper exposure about each layer's grey point $g_k$, the exposure that prints the aim grey card:\n\n$$\nx_k \\leftarrow g_k + \\gamma\\,(x_k - g_k) .\n$$\n\nThis is the same as using a paper whose curves are $\\gamma$ times steeper, which is what spektrafilm's print gamma factor does to its paper curves. Real colour papers are made in a few fixed contrasts, not on a dial, so Contrast is a macro over materials that are plausible rather than real. It is free: it reshapes the coordinates at which the print table is read.\n\n- **Range:** 0.6 to 1.6, default 1.00.\n- **Use:** 0.85–0.95 for contrasty scenes in hard light; 1.1–1.25 for flat light and overcast days.\n\nFar below 1 the print loses its blacks and starts to look like a scan; far above 1 the window narrows and both ends of the scale block up.\n\n> **Try it.** Compare [a soft paper, 0.8](st:set?contrast=0.8) with [a hard one, 1.3](st:set?contrast=1.3), then [return to 1.0](st:set?contrast=1).\n\n## Pre-flash\n\nPrinters flashed paper with a short uniform exposure before or after the main one, to hold detail in near-whites. spektrafilm simulates the same flash on its virtual paper. The flash adds a fixed amount of light $H_f$ to every point, in linear exposure:\n\n$$\nx_k \\leftarrow \\log_{10}\\!\\Big(10^{x_k} + \\mathrm{K.PREFLASH}\\cdot\\tfrac{p}{100}\\cdot 10^{\\,g_k - 0.6}\\Big), \\qquad \\mathrm{K.PREFLASH} = 0.35 .\n$$\n\nThe flash is scaled to the exposure 0.6 log H below grey, which sits near the start of the paper's toe. Where the main exposure is large, in midtones and shadows, the flash adds almost nothing. Where it is small, in the brightest highlights, the flash lifts the exposure off the toe, so tones that would print as bare paper get a trace of density and their detail back.\n\n- **Range:** 0 to 100, default 0.\n- **Use:** 10 to 40 for a white dress, a cloud or a lamp shade that prints as blank paper. Beyond about 60 the whites turn grey.\n\nPre-flash is the physical form of highlight recovery. The operator form, **Highlights**, is in Chapter 6.\n\n> **Try it.** [Flash the paper, 30](st:set?preflash=30) and watch the brightest parts of the sign and the wall. Then [overdo it, 90](st:set?preflash=90) to see the whites go grey.\n\n## Whites\n\nA print is seen as a reflection. Its white is the paper's own: unexposed Portra Endura reflects about 81 % of the viewing light. The darkest the paper can go reflects 0.36 %, a visual density of 2.44. A scene's perfect white prints at a density of about 0.16, which leaves room for highlight detail (§10.4).\n\nA display has its own white, so something must map one onto the other. **Whites** sets that mapping:\n\n$$\nY \\leftarrow \\frac{Y}{Y_{\\text{paper}}}\\; 2^{\\,w/100} .\n$$\n\nAt 0 the paper's white is the display's white, the natural way to show a print on its own. Negative values dim the print, as a print looks beside a brighter white. Positive values brighten it beyond paper white, and values that would pass the display's white are rolled off with a soft shoulder instead of clipped.\n\nUp to 0 this is a choice of white, which makes it a macro. Above 0 it is a gain with a shoulder, which no print has, so Whites is a hybrid.\n\n- **Range:** −100 to +100, default 0.\n- **Use:** −20 to 0 to show a print as a print; +10 to +30 for a screen image with more sparkle.\n\n## Blacks\n\nThe deepest black of a print depends on the room it is seen in. Light reflected off the print's surface and from the room reaches the eye without passing through the dyes. Giorgianni and Madden model this viewing flare as a fraction $f$ of the reproduced white, added at the colour of the viewing light (§10.4, C.9):\n\n$$\n(X, Y, Z) \\leftarrow (X, Y, Z) + \\tfrac{f}{100}\\,Y_w \\left(\\tfrac{x_E}{y_E},\\ 1,\\ \\tfrac{1 - x_E - y_E}{y_E}\\right) .\n$$\n\n**Blacks** sets $f$ from 0 to `K.FLARE_MAX` = 4 %. The default of 12 on the slider is 0.48 % flare: a glossy print in a dim room. On the textbook's running frame, 1 % flare lifts the black from density 1.96 to 1.75 and moves it towards the light's colour.\n\nFlare is a physical setting of the viewing, so Blacks is a macro.\n\n- **Range:** 0 (gloss, black viewing booth) to 100 (4 %, a matte print in a bright room); default 12.\n- **Use:** raise it for a softer, matte look that still keeps the shadows' tonal order.\n\n> **Try it.** Compare [a deep gloss black](st:set?blacks=0) with [a matte print in a bright room](st:set?blacks=75), then [return to the default](st:set?blacks=12).\n\n> **Exercise.** Make the sample look like a matte print on a soft paper: Contrast 0.9, Blacks 60, Whites −10. Which of these three would a printer have controlled, and which belongs to the room?\n"},{"id":"ch4","title":"Crossover and split colour","order":4,"body":"# Crossover and split colour\n\nPrinter lights shift all three paper exposures by fixed amounts. A shift can remove a cast that is the same at every density. It cannot remove a cast that changes with density: magenta shadows under neutral highlights, or green highlights over neutral shadows. Printers called this **crossover**, because the three layers' curves cross instead of running parallel. The two colour pads, **Shadow colour** and **Highlight colour**, are the Studio's answer. They are macros, and they are free.\n\n## Where crossover comes from\n\nA negative crosses over when its three layers do not have the same contrast, or when something between the layers changes with density:\n\n- **Mixed light.** Shadows lit by blue sky and highlights lit by the sun give different casts at different densities.\n- **Processing errors.** A wrong developer temperature or time changes one layer's gamma more than another's.\n- **Expired or badly stored film.** Fog raises one layer's toe and flattens its contrast.\n- **Fading.** Dyes fade in proportion to their amount, so the cast grows with density (design document, 4.11).\n- **The scanner's limits.** An unmeasured LED or a clipped channel bends one channel's response.\n\nIn each case the error in one layer grows with exposure. To first order, it is an offset plus a slope.\n\n## The two pads\n\nEach pad is a two-dimensional control: its horizontal axis is warmth, its vertical axis is tint. Both use the same directions as the Warmth and Tint sliders (Chapter 2), scaled by `K.SPLIT` = 0.5. A pad at (100, 0) is half of Warmth +100, applied at the pad's anchor.\n\nThe anchors sit in paper exposure, 0.4 log H either side of each layer's grey point $g_k$ (`K.SPLIT_SPAN` = 0.4). Shadows have *more* paper exposure, so their anchor is above grey:\n\n$$\nx_s = g + 0.4, \\qquad x_h = g - 0.4 .\n$$\n\nWith $U_s$ and $U_h$ the light offsets of the two pads, the change applied at exposure $x$ is a straight line between them:\n\n$$\n\\Delta x(x) = U_s + \\frac{x - x_s}{x_h - x_s}\\,\\big(U_h - U_s\\big) .\n$$\n\n```svg\n<svg viewBox=\"0 0 440 210\" width=\"440\">\n<line x1=\"40\" y1=\"110\" x2=\"420\" y2=\"110\" class=\"mut\"/>\n<line x1=\"230\" y1=\"20\" x2=\"230\" y2=\"180\" class=\"hair\" stroke-dasharray=\"3 3\"/>\n<line x1=\"120\" y1=\"20\" x2=\"120\" y2=\"180\" class=\"hair\"/>\n<line x1=\"340\" y1=\"20\" x2=\"340\" y2=\"180\" class=\"hair\"/>\n<line x1=\"40\" y1=\"160\" x2=\"420\" y2=\"40\" class=\"ink\" stroke-width=\"1.6\"/>\n<circle cx=\"120\" cy=\"134.7\" r=\"4\" class=\"f-ink\"/>\n<circle cx=\"340\" cy=\"65.3\" r=\"4\" class=\"f-ink\"/>\n<text x=\"120\" y=\"196\" class=\"mut\" font-size=\"11\" text-anchor=\"middle\">x_h = g − 0.4</text>\n<text x=\"230\" y=\"196\" class=\"mut\" font-size=\"11\" text-anchor=\"middle\">g</text>\n<text x=\"340\" y=\"196\" class=\"mut\" font-size=\"11\" text-anchor=\"middle\">x_s = g + 0.4</text>\n<text x=\"128\" y=\"152\" class=\"ink\" font-size=\"11\">U_h</text>\n<text x=\"348\" y=\"82\" class=\"ink\" font-size=\"11\">U_s</text>\n<text x=\"44\" y=\"104\" class=\"mut\" font-size=\"11\">Δx = 0</text>\n<text x=\"300\" y=\"30\" class=\"acc\" font-size=\"11\">extrapolates linearly</text>\n<text x=\"230\" y=\"14\" class=\"mut\" font-size=\"11\" text-anchor=\"middle\">← highlights · paper exposure · shadows →</text>\n</svg>\n```\n\n*Figure 4.1. The change in one layer's paper exposure set by the two pads: linear in log exposure, through the two anchors, and continued beyond them.*\n\n## An offset and a slope per layer\n\nWrite the line out for one layer. At the grey point the change is the mean of the two pads, and the slope is their difference over the span:\n\n$$\n\\Delta x_k = \\underbrace{\\tfrac12\\,(U_{s,k} + U_{h,k})}_{\\text{offset}} + \\underbrace{\\frac{U_{s,k} - U_{h,k}}{0.8}}_{s_k}\\,(x_k - g_k) .\n$$\n\nThe offset is a printer light. The slope multiplies the layer's exposure about grey by $1 + s_k$, which is exactly what a paper whose layers differ slightly in contrast would do. So the pads are a macro over plausible materials: a paper with three unequal gammas, as an over- or under-developed paper would have, and as darkroom printers sometimes paired with a crossed negative. Only per-layer offset and slope are allowed. Anything curvier, such as a correction that bends in the midtones, would be a new operator, and the pads do not do it.\n\nBecause the line continues past the anchors, a large difference between the pads keeps growing into the deepest shadows and the brightest highlights. That is right for crossover, which also keeps growing, but it means large settings should be judged at both ends of the scale.\n\nThe pads act on the paper exposure before **Contrast** (Chapter 3). A layer's final contrast is therefore $\\gamma\\,(1 + s_k)$.\n\n## Using the pads\n\n**To correct crossover:**\n\n1. Balance the midtones with Auto colour, Warmth and Tint, using a neutral near mid-grey.\n2. Find a neutral in the shadows (a dark grey coat, a shadowed wall). Move the **Shadow colour** pad until it is neutral.\n3. Find a neutral in the highlights (a white wall, a cloud). Move the **Highlight colour** pad until it is neutral.\n4. Recheck the midtones. Equal and opposite pad settings do not move the grey point, so they should still be neutral.\n\n**For split toning** the same pads work the other way: warm highlights and cool shadows is the classic, the look of a print toned in two baths.\n\n- **Range:** −100 to +100 on each axis of each pad, default (0, 0).\n- **Use:** 5 to 30 for crossover; 20 to 60 for visible toning.\n\n> **Try it.** Make [cool shadows and warm highlights](st:set?shadowColour=-40,0&highlightColour=40,0), the split-tone look. Then try the opposite, [warm shadows and cool highlights](st:set?shadowColour=40,0&highlightColour=-40,0), which reads as late-afternoon light. [Reset the pads](st:set?shadowColour=0,0&highlightColour=0,0) when done.\n\n> **Try it.** Simulate a typical crossover fault, [magenta shadows](st:set?shadowColour=0,40), and correct it with [the opposite move in the shadow pad](st:set?shadowColour=0,0). The midtones never moved.\n\n> **Exercise.** A negative's red layer has a gamma 10 % lower than its green and blue layers. What slopes $s_k$ cancel it, up to a change of density? The pads move only along warmth and tint, whose layer components sum to zero, so look for slopes of the form $(\\tfrac23, -\\tfrac13, -\\tfrac13)\\,s$. Find $s$, then check that the offset you need at grey is zero.\n"},{"id":"ch5","title":"Film character","order":5,"body":"# Film character\n\nThe **Paper and film** section holds the controls that change the materials, or add what the materials do on their own:\n\n- **Re-shoot on** prints the frame as if it had been shot on another film.\n- **Halation** adds the red glow a film makes around bright light.\n- **Grain** adds dye-cloud grain.\n- **Fade** ages the print.\n- **Edge burn** and **Sky burn** are the two burns every printer did.\n\nAll of them are macros, apart from parts of Grain and the Re-shoot blend, because each one is a setting of something the physical model already contains.\n\n## Re-shoot on\n\nA negative records each layer's exposure through that film's characteristic curve. If the curves are known, the exposures can be recovered and developed again on a different film (§10.5). **Re-shoot on** does this layer by layer:\n\n$$\nc^B_k = f^B_k\\!\\big(f^{A\\,-1}_k(c_k)\\big),\n$$\n\nwhere $f^A_k$ is the curve of layer $k$ of the film you shot and $f^B_k$ that of the film you choose. The new dye amounts are then printed through film B's own dyes, so film B's colour rendering and its unwanted absorptions come with it: the table from dye amounts to printing density is rebuilt for film B.\n\nTwo approximations are built in:\n\n- **Layer exposures carry over one to one.** Film B's red layer is given the exposure that film A's red layer recorded. A full re-exposure would need the scene's spectra, because two films' layers do not see exactly the same wavelengths. What this keeps is the difference the textbook cares most about: the shapes of the curves and the dyes.\n- **Noise in the toe is amplified.** The inverse curve multiplies noise by $1/\\gamma$, the reciprocal of the local slope (§4.7). Deep shadows of film A, where its curve is flattest, become noisier when re-developed on a steeper film.\n\n**Re-shoot amount** blends the two prints in printing density:\n\n$$\nPD = (1 - t)\\,PD_A + t\\,PD_B .\n$$\n\nOnly $t = 0$ and $t = 100\\,\\%$ are prints a darkroom could make, so the amount is a hybrid: a useful operator between its ends. The film choice itself is a macro, and a rebuild.\n\n- **Use:** Ektar 100 for saturation and contrast; Portra 160 for softness; Gold 200 or UltraMax 400 for warmth. Amounts of 30 to 70 % are a gentle push towards a stock.\n\n> **Try it.** [Re-shoot on Ektar 100](st:set?reshoot=kodak_ektar_100&reshootAmount=100), then [halfway](st:set?reshootAmount=50), then [on Portra 160](st:set?reshoot=kodak_portra_160&reshootAmount=100). [Back to the same film](st:set?reshoot=none).\n\n## Halation\n\nBright light that passes through the emulsion can reflect off the back of the film base and come back up into the emulsion a little further away. The layer nearest the base, the red-sensitive one, receives most of that returning light. An anti-halation layer suppresses it; where it is weak or absent, bright areas grow a soft halo in the red layer (§7.5).\n\nFollow the halo through the chain:\n\n1. More red-layer exposure around a bright area means more cyan dye in the negative there.\n2. More cyan in the negative blocks red light at the printer.\n3. Less red light means less cyan dye in the print.\n4. The halo prints red-orange.\n\nScatter and halation act on exposure, before the characteristic curve (§7.6, item 1). The Studio therefore applies Halation in the film's own exposure. Each layer's exposure is recovered through the film's inverse curve, $E_k = 10^{f_k^{-1}(c_k)}$. A blurred copy is added to the red and green layers:\n\n$$\nE_R \\leftarrow E_R + \\mathrm{K.HAL\\_R}\\,\\tfrac{h}{100}\\,(K * E_R), \\qquad E_G \\leftarrow E_G + \\mathrm{K.HAL\\_G}\\,\\tfrac{h}{100}\\,(K * E_G),\n$$\n\nwith `K.HAL_R` = 0.30 and `K.HAL_G` = 0.08. The new exposure goes forward through the curve to give new dye amounts. The kernel $K$ is a sum of two Gaussians with widths of 0.4 % and 1.8 % of the frame's long side (`K.HAL_RADII`). The blur is computed in the low-resolution global pass, so Halation is a spatial control.\n\nBecause the added light is proportional to exposure, the halo only shows around strong highlights: lamps, sunlit edges, specular reflections. A grey wall gains a fraction of its own exposure everywhere and simply prints a little warmer.\n\n- **Range:** 0 to 100, default 0.\n- **Use:** 10 to 30 for a hint of the film look; 50 and above imitates film without an anti-halation layer.\n\n> **Try it.** Add [Halation 40](st:set?halation=40) and look at the brightest edges of the sign. Then [turn it up to 90](st:set?halation=90), and [off](st:set?halation=0).\n\n## Grain\n\nA film's grain is made of dye clouds, formed in each layer during development (§7.1, §7.6 item 3). The three layers grain independently, which is why colour grain is speckled in colour rather than in grey. Its variance grows with density: for dye clouds the granularity is roughly proportional to the density formed (Siedentopf, C.7). **Grain** adds a field of that kind to the dye amounts:\n\n$$\nc_k \\leftarrow c_k + \\sigma_0\\,\\sqrt{c_k + 0.05}\\;n_k(x), \\qquad \\sigma_0 = \\mathrm{K.GRAIN\\_SIGMA}\\cdot\\tfrac{g}{100}, \\quad \\mathrm{K.GRAIN\\_SIGMA} = 0.035 .\n$$\n\nHere $n_k(x)$ are three independent noise fields with unit variance over the reference aperture, and their correlation length is set by **Grain size**. The 0.05 keeps a trace of grain in the thinnest areas, where the base and the toe still carry a few clouds.\n\n**Grain follows the area law.** Selwyn's law says that granularity $G = A\\sigma_A^2$ is constant across apertures (§7.2, C.7), so the standard deviation seen through a pixel falls as the pixel grows: $\\sigma^2 \\propto G/A$. The Studio samples the noise field through a mip-map, whose levels average areas, so the grain's variance follows the same law at every zoom. At fit-to-screen the grain almost disappears, as it does in a small print. At 100 % it is all there. Judge grain at the size you will print.\n\nThe scan already contains the film's own grain. Grain adds more, as if the film were faster; **Grain reduction** (Chapter 8) removes some.\n\n- **Grain size** scales the clouds: 1× is a 400-speed film, 0.5× a fine 100-speed film, 2–3× a pushed or 35 mm-blown-up look.\n- **Kind:** at 1× with moderate amounts, Grain is a film's own granularity model, a macro. Large amounts and sizes are invented film, an operator. So Grain and Grain size are hybrids, and both are spatial.\n- **Range:** Grain 0 to 100 (default 0); Grain size 0.5× to 3× (default 1×).\n\n> **Try it.** Set [Grain 50 at 1×](st:set?grain=50&grainSize=1) and view at 100 %; then [coarse grain, 2×](st:set?grainSize=2); then zoom out to fit and watch it average away. [Remove it](st:set?grain=0&grainSize=1).\n\n## Fade\n\nColour prints fade. Their dyes are lost in proportion to their amount, at different rates for different dyes, while the paper base yellows (Gschwind and Frey's model, design document 4.11). **Fade** runs that model forwards on the paper's dyes, to age the print:\n\n$$\nc_p \\leftarrow F\\,c_p, \\qquad b_p(\\lambda) \\leftarrow b_p(\\lambda) + \\phi\\,s(\\lambda),\n$$\n\nwhere $F$ is a diagonal matrix whose cyan entry falls fastest, $\\phi$ grows with the slider, and $s(\\lambda)$ is a yellow stain added to the paper's base density. A faded print therefore drifts towards red, its blacks weaken, and its whites turn cream.\n\nFade acts on the print's dyes, after the paper's curves, and it rebuilds the table from paper dye amounts to XYZ. It is a macro: a physical model of a real process, applied to a real material.\n\n- **Range:** 0 to 100, default 0.\n- **Use:** 10 to 25 for a print that has spent a decade in an album; 60 and beyond for a 1970s drugstore print.\n\nThe inverse problem, restoring a faded *negative*, needs the same model in the other direction and is not built yet (design document 4.11).\n\n> **Try it.** [Age the print, Fade 40](st:set?fade=40), then [heavily, 80](st:set?fade=80). [Back to new](st:set?fade=0).\n\n## Edge burn and Sky burn\n\nPrinters burned in the edges and corners of almost every print, to hold the eye inside the frame. They burned in skies, which print light because a negative's sky is dense. Both moves are extra printing exposure through a soft mask, so both are printer lights applied locally (§10.2):\n\n$$\nx_k \\leftarrow x_k + 0.025\\,b\\,m(r) \\quad \\text{(Edge burn)}, \\qquad x_k \\leftarrow x_k + 0.025\\,b\\,m(y) \\quad \\text{(Sky burn)} .\n$$\n\n$b$ is in points. $m(r)$ rises smoothly from 0 in the middle of the frame to 1 at the corners, and $m(y)$ falls smoothly from 1 at the top edge to 0 part-way down. More exposure means a darker print, so both controls darken.\n\nBecause they act on the print table's coordinates, burns cannot halo or change contrast: they are exactly a longer exposure under a card. Both are macros, and both are free.\n\n- **Range:** 0 to 20 points each, default 0.\n- **Use:** Edge burn 3 to 8 points (a quarter to two thirds of a stop at the corners); Sky burn 4 to 12 points.\n\n> **Try it.** [Burn the edges, 6 points](st:set?edgeBurn=6), then [burn the sky, 8 points](st:set?skyBurn=8). [Remove both](st:set?edgeBurn=0&skyBurn=0).\n"},{"id":"ch6","title":"Tone finishing","order":6,"body":"# Tone finishing\n\nThe macros of Chapters 2 to 5 set the print. The **Tone** controls finish it: **Contrast mask**, **Highlights**, **Shadows**, **Clarity** and **Texture**. They are operators, outside the physical model, and all of them are spatial: they treat a pixel according to its neighbourhood. They work in printing density, where the darkroom's own tone tools worked, and they share one idea: split the image into a smooth *base* and the *detail* on top of it, then change one without the other.\n\n## Base and detail\n\nLet $\\bar Y$ be the mean of the three printing densities at a pixel, a neutral measure of how dense the negative is there. Split it into two parts:\n\n$$\n\\bar Y = B + (\\bar Y - B),\n$$\n\nwhere $B$ is a smooth *base* that follows the large areas of the image and $\\bar Y - B$ is the *detail*: texture, edges and small shapes riding on the base. Change the base and you change how light or dark large areas print, without touching their detail. Change the detail and you change local contrast, without moving large areas. This is base/detail tone mapping (Durand and Dorsey, 2002), done here in density.\n\nEvery change is applied to all three channels equally:\n\n$$\nPD_k \\leftarrow PD_k + \\Delta(x), \\qquad k = R, G, B .\n$$\n\nA neutral shift of printing density is a neutral shift of paper exposure, so the tone operators move lightness and leave the print's colour balance alone. The darkroom's contrast masks worked the same way: they were usually made on black-and-white film, so they added neutral density to all three colours.\n\n## The edge-aware base\n\nA plain blur makes a poor base. Near an edge it mixes the two sides, so an operator that changes the base leaves a halo: a dark rim along a bright edge. The darkroom unsharp mask had exactly this rim, and printers used it on purpose to sharpen edges. The Studio uses an **edge-aware** base instead, from the guided filter of He, Sun and Tang (ECCV 2010). In each window of radius $r$, the filter models its output as a linear function of its guide; guided by $\\bar Y$ itself:\n\n$$\nq = a\\,\\bar Y + b, \\qquad a = \\frac{\\sigma^2}{\\sigma^2 + \\varepsilon}, \\qquad b = (1 - a)\\,\\mu ,\n$$\n\nwhere $\\mu$ and $\\sigma^2$ are the window's mean and variance. In a flat window, $\\sigma^2 \\ll \\varepsilon$, so $a \\approx 0$ and the output is the local mean: smooth. Across an edge, $\\sigma^2 \\gg \\varepsilon$, so $a \\approx 1$ and the output follows the edge: no halo. The coefficients are averaged over the overlapping windows and applied per pixel. Every step is a box mean, which running sums compute at a cost that does not depend on the radius. The Studio's shaders compute the box means with separable loops instead, whose cost grows with the radius, and keep it small by working at 640 pixels (Chapter 11).\n\nThe Studio computes $a$ and $b$ once, at low resolution, in the global pass. It upsamples them and applies them at full resolution (the \"fast guided filter\"). Two bases are kept:\n\n- the **large** base, radius `K.MASK_RADIUS` = 4 % of the frame's long side, for the contrast mask, highlights and shadows;\n- the **mid** base, radius `K.MID_RADIUS` = 0.8 %, for clarity.\n\nTexture uses a plain Gaussian of radius `K.FINE_RADIUS` = 0.09 %, because at that scale there are no large edges to protect. All radii are fractions of the frame, not pixels, so a preview and a full-size export show the same result at the same viewing size.\n\n## Contrast mask\n\nIn the darkroom a contrast mask was a weak, unsharp positive printed from the negative and taped to it in register. Where the negative was thin (the print's shadows) the mask added density; where it was dense (the print's highlights) it added little. The sandwich printed with less large-area contrast, while fine detail, too small for the blurred mask to follow, kept all of its contrast. **Contrast mask** does the same on the edge-aware base:\n\n$$\nB' = B_{\\text{ref}} + \\Big(1 - \\mathrm{K.MASK}\\cdot\\tfrac{m}{100}\\Big)\\,(B - B_{\\text{ref}}), \\qquad \\Delta = B' - B, \\qquad \\mathrm{K.MASK} = 0.6 .\n$$\n\n$B_{\\text{ref}}$ is the frame's middle tone. At +100 the base's departures from it shrink to 40 %. Large shadows print lighter, large highlights print darker, and the edges between them stay sharp because the base follows them.\n\nNegative values do the opposite: an *anti-mask* that increases large-area contrast while leaving detail alone. That suits a flat, misty frame.\n\n- **Range:** −100 to +100, default 0.\n- **Use:** +20 to +50 for frames with bright skies and dark foregrounds, the classic case for a mask. −20 to −40 for haze.\n\n> **Try it.** [Contrast mask +40](st:set?mask=40): the dark foliage opens and the bright wall calms down, with no halo along the sign. Compare with [the opposite, −40](st:set?mask=-40). [Off](st:set?mask=0).\n\n## Highlights and Shadows\n\n**Highlights** and **Shadows** change the base only on one side of the frame's middle tone. In printing density the print's highlights are the *dense* end of the negative and its shadows the *thin* end, so:\n\n$$\nB' = B - \\mathrm{K.ZONE}\\,\\tfrac{h}{100}\\,w_h(B) \\quad\\text{(Highlights)}, \\qquad B' = B + \\mathrm{K.ZONE}\\,\\tfrac{s}{100}\\,w_s(B) \\quad\\text{(Shadows)},\n$$\n\nwith `K.ZONE` = 0.25 density at ±100. The weights are smooth:\n\n- $w_h(B)$ rises from 0 at the middle tone to 1 in the densest parts of the frame;\n- $w_s(B)$ does the same towards the thinnest parts.\n\nRead the signs in print terms:\n\n- **Highlights +** lowers the printing density of bright areas, so the paper gets more exposure there: highlights print darker and recover detail.\n- **Highlights −** brightens them.\n- **Shadows +** raises the printing density of dark areas, so the paper gets less exposure: shadows open up.\n- **Shadows −** deepens them.\n\nThe detail $\\bar Y - B$ is untouched, so recovered highlights keep their texture and opened shadows keep their contrast.\n\nThese are the operator versions of two macros. Pre-flash (Chapter 3) recovers highlights physically, and Blacks (Chapter 3) lifts shadows the way a room does. The operators are local and stronger. The macros are global and always look like a print. Try the macros first.\n\n- **Range:** −100 to +100 each, default 0.\n- **Use:** Highlights +20 to +60 for a bright sky; Shadows +20 to +50 for backlit subjects.\n\n> **Try it.** [Recover the highlights, +50](st:set?highlights=50), then [open the shadows, +40](st:set?shadows=40). Compare with the physical route: [reset them](st:set?highlights=0&shadows=0) and try [Pre-flash 40 and Blacks 40](st:set?preflash=40&blacks=40).\n\n## Clarity\n\n**Clarity** raises or lowers mid-scale local contrast, the contrast of shapes a few percent of the frame across: the folds of cloth, the modelling of a face, the stones of a wall.\n\n$$\nPD_k \\leftarrow PD_k + \\mathrm{K.CLARITY}\\cdot\\tfrac{c}{100}\\,\\big(\\bar Y - B_{\\text{mid}}\\big), \\qquad \\mathrm{K.CLARITY} = 0.8 .\n$$\n\nBecause $B_{\\text{mid}}$ is edge-aware, clarity raises contrast inside shapes without outlining them. Negative clarity flattens the mid scale and softens skin and cloth.\n\n- **Range:** −100 to +100, default 0.\n- **Use:** +10 to +30 for landscapes and architecture; −10 to −30 for portraits.\n\n> **Try it.** [Clarity +40](st:set?clarity=40) on the stone wall, then [−40](st:set?clarity=-40). [Off](st:set?clarity=0).\n\n## Texture\n\n**Texture** raises or lowers the finest detail, a fraction of a millimetre on the film:\n\n$$\nPD_k \\leftarrow PD_k + \\mathrm{K.TEXTURE}\\cdot\\tfrac{t}{100}\\;\\mathrm{core}\\big(\\bar Y - G * \\bar Y\\big), \\qquad \\mathrm{K.TEXTURE} = 1.2 .\n$$\n\nThe **coring** function passes large differences and shrinks small ones towards zero. Grain lives in the small differences, so Texture sharpens leaves, hair and fabric without turning up the grain as much. Coring is a soft threshold, not a grain model: at high settings grain still rises.\n\n- **Range:** −100 to +100, default 0.\n- **Use:** +10 to +30 for foliage and fabric; negative values soften fine detail without blurring edges.\n\n> **Try it.** [Texture +50](st:set?texture=50) and view the leaves at 100 %. [Off](st:set?texture=0).\n\n## Look strength\n\n**Look strength** $\\lambda$ scales every finishing operator at once: each operator's value is replaced by $\\lambda v$. It runs from 0 to 150 %, and the default is 100 %. At 0 the print is exactly the physical print the macros made. At 150 % every operator is half as strong again.\n\nThe macros are not scaled, so Look strength can never change a print's exposure, balance, paper or film. That makes it the safest way to judge whether the finishing is doing too much: drop it to 0, look, and bring it back.\n\n> **Try it.** Set up a strong finish, [mask, clarity and saturation](st:set?mask=40&clarity=30&dyeSat=25), then [turn Look strength to 0](st:set?look=0) and [back to 100](st:set?look=100).\n\n> **Caveat.** The tone operators change printing density, so they also change what the paper sees. A strong contrast mask moves tones back into the paper's window, as a real mask did; the [print window](st:show?view=window) shows the histograms narrowing.\n"},{"id":"ch7","title":"Colour finishing","order":7,"body":"# Colour finishing\n\nThe print's colour is set by the macros: the lights, the paper and the film. The **Colour** operators then work on top of that print:\n\n- **Saturation** acts on the negative's dyes, before printing.\n- **Vibrance**, **Colour density**, **Saturation rolloff** and **Hue shifts** act on the print's colour, after printing, in a perceptual colour space.\n\nThe difference between the two places is the most useful thing in this chapter.\n\n## Saturation, in the dyes\n\nA colour negative already enhances saturation chemically. Development inhibitors released in one layer hold back development in its neighbours, so a strongly exposed layer suppresses the others and colours separate more than the dyes alone would give: the interimage effect (§6.1, §6.4). **Saturation** imitates a stronger or weaker interimage effect. It scales each pixel's dye amounts away from their neutral:\n\n$$\n\\mathbf c' = \\mathbf n + \\Big(1 + \\mathrm{K.DYESAT}\\cdot\\tfrac{v}{100}\\Big)\\,(\\mathbf c - \\mathbf n), \\qquad \\mathrm{K.DYESAT} = 0.6 ,\n$$\n\nwhere $\\mathbf n$ is the dye triple the film forms for a neutral at the same mean exposure: a point on the film's grey ramp. At +100 the departure from neutral grows by 60 %. At −100 it shrinks to 40 %.\n\nThe result then goes through the printer, the paper's curves and its dyes like any negative. That has two consequences that a perceptual slider does not have:\n\n- **More saturated colours also get denser in the print.** More dye on the negative means more contrast between layers at the paper, and the paper's dyes absorb more light where colours are strong. Saturated reds deepen instead of glowing.\n- **The paper's own limits apply.** A colour cannot leave the paper's gamut, because it is printed by the paper. Its hues bend the way the paper's dyes bend them.\n\nSaturation is an operator: no physical process scales the dyes of a developed negative. The physical route is a film with a stronger interimage effect, which is what Re-shoot on to Ektar 100 partly does (Chapter 5).\n\n- **Range:** −100 to +100, default 0.\n- **Use:** +10 to +30 for a film-like richness; −20 to −40 for a muted, faded-film look that still prints with real blacks.\n\n> **Try it.** [Saturation +40](st:set?dyeSat=40), then compare with [Vibrance +40 alone](st:set?dyeSat=0&vibrance=40). The first darkens the reds of the sign; the second brightens them.\n\n## OKLab\n\nThe operators after the print work in OKLab (Ottosson, 2020). It gives each colour a lightness $L$, a chroma $C$ and a hue angle $h$. It is a perceptual space built from one 3×3 matrix, a cube root and a second 3×3 matrix, which makes it cheap in a shader, and its hues stay steady as chroma changes.\n\nThe design document specified CAM16-UCS for these moves. CAM16 models the viewing conditions as well, but it costs more per pixel; the Studio uses OKLab for speed. The print has already been adapted to the display's white (Chapter 1), so the difference matters little for moves of this size.\n\n## Vibrance\n\n**Vibrance** raises chroma most where it is low, and least on skin:\n\n$$\nC' = C\\,\\Big(1 + \\mathrm{K.VIBRANCE}\\cdot\\tfrac{v}{100}\\,\\big(1 - C/C_{\\max}\\big)\\,\\big(1 - 0.7\\,w_{\\text{skin}}\\big)\\Big), \\qquad \\mathrm{K.VIBRANCE} = 0.8 .\n$$\n\nHere $C_{\\max}$ is a chroma near the edge of the display's gamut, and $w_{\\text{skin}}$ is a smooth weight that is 1 at the hue of skin and falls to 0 away from it. Dull colours gain most, colours that are already strong gain little and so do not clip, and faces keep their colour. Negative values mute the print in the same order.\n\nVibrance keeps lightness, so saturated colours get brighter-looking rather than denser: the opposite of Saturation's character.\n\n- **Range:** −100 to +100, default 0.\n- **Use:** +10 to +30 for landscapes; small negative values for a quiet portrait palette.\n\n> **Try it.** [Vibrance +50](st:set?vibrance=50): the leaves gain more than the already-red sign. [Off](st:set?vibrance=0).\n\n## Colour density\n\nFilm and paper make colour by taking light away. A strongly coloured area of a print carries more dye, so it is darker as well as more saturated. Additive colour, on a screen, does the reverse. **Colour density** chooses between those characters:\n\n$$\nL' = L - \\mathrm{K.COLDENS}\\cdot\\tfrac{d}{100}\\;C, \\qquad \\mathrm{K.COLDENS} = 0.35 .\n$$\n\nPositive values darken saturated colours in proportion to their chroma: richer, heavier, more like a dye-transfer print. Negative values lighten them, a brighter, more digital look. Neutrals ($C = 0$) are untouched, so the tonal scale of greys does not move.\n\n- **Range:** −100 to +100, default 0.\n- **Use:** +15 to +40 with Saturation or Vibrance, to keep strong colours from glowing.\n\n> **Try it.** [Colour density +60](st:set?colourDensity=60), then [−60](st:set?colourDensity=-60). [Off](st:set?colourDensity=0).\n\n## Saturation rolloff\n\nIn a print, colour fades towards both ends of the scale. Deep shadows carry nearly the maximum of all three dyes, which leaves little room for colour. Near-whites carry almost no dye at all, which leaves little colour to show. The paper does some of this by itself. **Saturation rolloff** adds more:\n\n$$\nC' = C\\,\\Big(1 - \\mathrm{K.ROLLOFF}\\cdot\\tfrac{r}{100}\\;w_{\\text{ends}}(L)\\Big), \\qquad \\mathrm{K.ROLLOFF} = 0.85 .\n$$\n\nThe weight $w_{\\text{ends}}(L)$ is 1 near black and near white and 0 through the midtones. At 100 the chroma of the deepest shadows and brightest highlights falls by 85 %. It hides coloured noise in shadows, cleans casts out of specular highlights, and gives the print's ends the look of an optical print.\n\n- **Range:** 0 to 100, default 0.\n- **Use:** 20 to 50 for most frames; more to clean up a scan with coloured shadow noise.\n\n> **Try it.** [Saturation rolloff 70](st:set?satRolloff=70) and look at the darkest part of the sign stand. [Off](st:set?satRolloff=0).\n\n## Hue shifts\n\n**Hue shifts** move one family of hues, and its chroma, without touching the others. There are six families, centred at these OKLab hue angles:\n\n| Family | Centre |\n|---|---|\n| Reds | 25° |\n| Skin | 55° |\n| Yellows | 100° |\n| Greens | 145° |\n| Blues | 250° |\n| Purples | 320° |\n\nEach family has two values, a hue shift $u$ and a saturation change $s$:\n\n$$\nh' = h + \\mathrm{K.HUE\\_DEG}\\cdot\\tfrac{u}{100}\\,w_i(h), \\qquad C' = C\\,\\Big(1 + \\tfrac{s}{100}\\,w_i(h)\\Big), \\qquad \\mathrm{K.HUE\\_DEG} = 30° .\n$$\n\nThe weight $w_i(h)$ is a smooth bump around the family's centre, so neighbouring families blend into each other without steps. A positive hue shift turns the family anticlockwise in OKLab: greens towards teal, reds towards orange, blues towards purple. Lightness is not changed.\n\nThese are the most computational controls in the Studio. Film and paper move hues together, because three dyes make every colour. Hue shifts can move one family on its own, which is useful and also easy to overdo.\n\n- **Range:** −100 to +100 for each value of each family, default 0.\n- **Use:**\n  - greens +10 to +30 with saturation −10 to −20 for the teal foliage of many modern film looks;\n  - skin saturation −10 to −20 for a softer portrait;\n  - blues −10 to −20 to keep skies from turning purple.\n\n> **Try it.** Turn [greens towards teal and quieten them](st:set?hues.greens=30,-20). Then [warm the reds towards orange](st:set?hues.reds=25,0). [Reset both](st:set?hues.greens=0,0&hues.reds=0,0).\n\n> **Exercise.** Make the sample's foliage teal two ways: with Hue shifts on greens, and with Warmth and Tint plus the shadow and highlight pads. Which one leaves the stone wall neutral, and why?\n"},{"id":"ch8","title":"Detail","order":8,"body":"# Detail\n\nThe **Detail** operators work at the smallest and largest scales of the print:\n\n- **Sharpness** and **Grain reduction** at the scale of a few pixels;\n- **Bloom** at the scale of a glow;\n- **Look strength**, which scales all finishing, is in this section of the panel but described in Chapter 6.\n\n## Sharpness\n\n**Sharpness** is an unsharp mask on the print's lightness, at the output's scale:\n\n$$\nY' = Y + \\mathrm{K.SHARP}\\cdot\\tfrac{s}{100}\\,\\big(Y - G_{0.7} * Y\\big), \\qquad \\mathrm{K.SHARP} = 1.2 .\n$$\n\n$G_{0.7}$ is a 3×3 binomial blur, close to a Gaussian of σ = 0.7 pixels of the rendered image. The gain on any pixel is held between 0.5 and 2, so the strongest settings cannot ring into black or white. The change in lightness is applied to all three colour channels in proportion, so edges sharpen without coloured fringes.\n\nThis is output sharpening, for the screen or the printer. It is not the capture sharpening of the design (a Richardson–Lucy deconvolution of the scanner's blur in linear light, §7.6), which the Studio does not have yet. Output sharpening depends on the output's size, so judge it at 100 % on the final file.\n\n- **Range:** 0 to 100, default 0.\n- **Use:** 20 to 40 for screen; more for a matte paper, which softens fine detail.\n\n> **Try it.** [Sharpness 50](st:set?sharpness=50) at 100 % zoom. [Off](st:set?sharpness=0).\n\n## Grain reduction\n\n**Grain reduction** smooths each dye layer with an edge-preserving (bilateral) filter. The strength is scaled to the grain expected at the pixel's density:\n\n$$\n\\mathbf c' = \\mathbf c + r\\,\\big(\\mathrm{bilateral}(\\mathbf c) - \\mathbf c\\big) .\n$$\n\n$r$ follows the slider, scaled by `K.GRAINRED` = 1.0. A bilateral filter averages a pixel with neighbours of similar value and ignores neighbours across an edge. Grain is a wiggle much smaller than real edges, so it is averaged away while edges stay.\n\nIt acts on the dye amounts, where grain is formed, layer by layer (§7.6, item 3). Colour speckle is removed with the grain, before the print's contrast can magnify it.\n\nThis is a simple operator, not the noise-spectrum-matched reduction of the design document (4.5), which is not built yet. Strong settings smooth fine texture along with the grain.\n\n- **Range:** 0 to 100, default 0.\n- **Use:** 20 to 50 for fast films and underexposed frames. Combine with Grain (Chapter 5) to replace a scan's grain with a finer, more even grain.\n\n> **Try it.** [Grain reduction 60](st:set?grainReduction=60), viewed at 100 %, then [replace the grain with a fine one](st:set?grain=30&grainSize=0.7). [Undo both](st:set?grainReduction=0&grain=0&grainSize=1).\n\n## Bloom\n\n**Bloom** is a soft glow around bright areas, like a diffusion filter on the camera lens or under the enlarger lens. It takes the light of the bright areas, blurs it widely, and adds it back to the print:\n\n$$\nXYZ \\leftarrow XYZ + \\mathrm{K.BLOOM}\\cdot\\tfrac{b}{100}\\;G_\\sigma * \\big(XYZ\\cdot w(Y)\\big), \\qquad w(Y) = \\mathrm{smoothstep}(0.55,\\,0.95,\\,Y), \\qquad \\mathrm{K.BLOOM} = 0.6 .\n$$\n\nThe weight $w$ is a soft threshold: nothing below $Y = 0.55$ glows, and everything above $0.95$ glows fully. $G_\\sigma$ is a Gaussian whose $\\sigma$ is 3.5 % of the frame's long side.\n\nThe glow is thresholded in the low-resolution global pass, blurred at half that size, then added at full resolution (Chapter 11). It carries the colour of the light that makes it.\n\nBloom and Halation (Chapter 5) both glow, but they are different:\n\n| | Halation | Bloom |\n|---|---|---|\n| where it happens | in the film, in the red layer's exposure | outside the model, in the print's light |\n| colour | red-orange | the colour of the bright area |\n| kind | macro | operator |\n\nA diffusion filter could be modelled as a scatter kernel in the enlarger, which would make Bloom a macro. The Studio does not model it that way yet.\n\n- **Range:** 0 to 100, default 0.\n- **Use:** 10 to 25 for a gentle glow on night scenes and backlight. More becomes a deliberate effect.\n\n> **Try it.** [Bloom 40](st:set?bloom=40), then compare with [Halation 40 instead](st:set?bloom=0&halation=40). [Off](st:set?halation=0).\n"},{"id":"ch9","title":"Working a roll","order":9,"body":"# Working a roll\n\nA lab printed a roll, not a frame. The frames of one roll share their film, their processing and their scanner, so the differences between them come from exposure, the light of each scene, and the scene itself. The Studio keeps one set of settings per frame, and the **Roll** controls let frames borrow from each other: **Roll consistency** and **Match frame**. Both are macros, and both are free: they only move printer lights.\n\n## Each frame's own balance\n\nWhen a frame is opened, its automatic lights come from its own large-area densities (Chapter 2): density fully integrated, colour integrated by Auto colour. Every frame of a roll is therefore printed at a sensible density and roughly neutral without any work.\n\nThe weakness is colour failure (§10.3). A frame that is mostly grass, or mostly a red wall, does not average to grey, and integrating it to grey adds the complementary colour to everything else in it. On the textbook's foliage frame the grey card's chroma at full integration is 20.9 (§10.3). Lowering Auto colour helps that frame but weakens the correction of real casts on every other frame.\n\n## Roll consistency\n\nWithin a roll, most of the colour differences that matter are shared: the film's own balance, its processing and the scanner. The scene-specific part varies from frame to frame and averages out over many frames. So the mean of a roll's automatic lights is a better estimate of the shared part than any one frame's lights. **Roll consistency** pulls a frame's automatic lights towards that mean:\n\n$$\nL \\leftarrow (1 - r)\\,L_{\\text{frame}} + r\\,\\bar L_{\\text{roll}} .\n$$\n\n- At 0 the frame keeps its own balance.\n- At 100 % every frame is printed with the roll's average lights: one filtration for the whole roll, the way a printer classified a roll once and printed it through (Hunt 16.6).\n\nExposure, Warmth, Tint and the other light controls act on top. The more frames the roll has, and the more varied their scenes, the better the mean.\n\n- **Range:** 0 to 100 %, default 0.\n- **Use:**\n  - 50 to 100 % for a roll shot in one light, such as a day outdoors or an evening under the same lamps;\n  - 0 to 30 % for a roll that changes light from frame to frame;\n  - always worth trying on a frame that is dominated by one colour.\n\n> **Try it.** Load a roll of several frames, choose a foliage-heavy frame, and set [Roll consistency 80 %](st:set?rollConsistency=80). The grey parts of the frame should move towards neutral while the greens stay green. [Back to the frame's own balance](st:set?rollConsistency=0).\n\n## Match frame\n\nSometimes one frame is already right and the others should look like it: a sequence, a series, a pair on facing pages. **Match frame** takes a reference frame and moves this frame's lights so that its mean paper exposure, the average of $x_k$ over the frame, matches the reference print's:\n\n$$\n\\Delta L = -m\\,\\big(\\bar x - \\bar x_{\\text{ref}}\\big) .\n$$\n\nAt 100 % both frames print with the same average colour and density. At lower values the frame moves part of the way.\n\nMatching averages is a strong assumption: it treats the two frames as if they showed the same mix of subjects. It works well for frames of one scene, such as a bracket, a portrait session or a view at different moments. It fails, honestly, for frames of different scenes: a sunset matched to a forest takes on the forest's colour. Use a partial amount, and judge a neutral.\n\n- **Range:** 0 to 100 %, default 0.\n- **Use:** 100 % within a sequence of one scene; 30 to 60 % to bring a series closer without flattening it.\n\n> **Try it.** Pick the frame you like best as the reference, open another frame of the same scene, and set [Match frame 100 %](st:set?matchAmount=100). Then [halfway](st:set?matchAmount=50), and [off](st:set?matchAmount=0).\n\n## Snapshots and recipes\n\nA frame's settings are a recipe: a short list of values, one per control, and nothing else. The Studio can keep a snapshot of a recipe and show it beside the current one in a [before/after split](st:show?view=split). Every export carries its recipe in a JSON file next to it, so any print can be remade exactly.\n\nA good order of work for a roll:\n\n1. **Settle the source.** Choose the scanner profile and the film, and check the rebate.\n2. **Set the roll's character.** On one representative frame, set the paper and the character (Chapter 5). These are the decisions you will want on every frame.\n3. **Balance with the roll in mind.** On each frame, set Exposure, then Roll consistency, then Warmth and Tint, and use the ring-around (Chapter 2) when in doubt.\n4. **Finish last.** Add finishing operators per frame, and judge them with Look strength at 0 and 100 %.\n\n> **Caveat.** The design's learned estimator (§12.7), which predicted lights with less than half the error of integrate-to-grey in simulation and was to learn from the frames you balance, is not built yet. Roll consistency is its simplest stand-in: a prior from the roll in place of a prior from you.\n"},{"id":"ch10","title":"Inside the Studio","order":10,"body":"# Inside the Studio\n\nThis chapter describes how the Studio computes a print. Two ideas run through it:\n\n- **Tables.** The expensive physics is evaluated ahead of time into lookup tables.\n- **Coordinates.** Almost every control is a cheap change to the coordinates at which those tables are read.\n\n## The per-pixel chain\n\nEvery pixel of the view passes through one chain, run as WebGL2 fragment shaders on the GPU:\n\n1. **Linear transmittance $T$** from the file, divided by the flat field if there is one. The Source view's Encoding setting says how to read it: linear (the default for 16-bit files and the sample), sRGB-encoded (the default for 8-bit files) or gamma 2.2.\n2. **Scanner density** $D_k = -\\log_{10}(T_k / T_k^{\\text{rebate}})$.\n3. **The analytical estimate** $\\mathbf a = K^{-1}(\\mathbf D - \\mathbf D_{\\text{base}})$, where $K$ is the 3×3 matrix of each unit dye's densities in each scanner channel (§9.2).\n4. **Dye amounts $\\mathbf c$** from the solve table, read at $\\mathbf a$; the table also gives the residual, which marks unreachable pixels.\n5. **The dye-domain controls:** Halation (through the film's 1-D inverse and forward curves), Saturation, Grain reduction, Grain, Re-shoot on (1-D curve maps).\n6. **Printing density** $PD$ from the $c \\to PD$ table of the chosen paper and film (a second table for the Re-shoot film, blended).\n7. **The printing-density operators** on the edge-aware bases: Contrast mask, Highlights, Shadows, Clarity, Texture.\n8. **Paper exposure** $x_k = -PD_k + \\mathrm{clear}_k + L_k$, then the light-like controls in order: balance, roll, Exposure, Warmth, Tint, burns, the two pads, Contrast, Pre-flash.\n9. **Paper dye amounts** $c_p$ through the paper's three 1-D curves; Fade scales them.\n10. **XYZ** from the $c_p \\to$ XYZ table: the paper's dyes and base, seen under 5000 K, adapted to D65.\n11. **Blacks** (flare) and **Whites** (white mapping, soft shoulder).\n12. **Bloom**; then OKLab for Vibrance, Colour density, Saturation rolloff and Hue shifts; then Sharpness.\n13. **Encoding** to sRGB or Display P3.\n\n## The tables\n\n| Table | Size | Depends on | Built when |\n|---|---|---|---|\n| solve: $\\mathbf a \\to \\mathbf c$, residual | 33³ nodes | scanner, film | the source changes |\n| $\\mathbf c \\to PD$ | 33³ nodes | film, paper, lamp | paper or film changes |\n| $\\mathbf c \\to PD$ (Re-shoot film) | 33³ nodes | second film, paper | Re-shoot on changes |\n| $c_p \\to$ XYZ | 33³ nodes | paper, viewing light, Fade | paper or Fade changes |\n| film curves and inverses | 1-D | film (and Re-shoot film) | film changes |\n| paper curves | 1-D | paper | paper changes |\n\nThe 3-D tables are read with trilinear interpolation.\n\n**The solve table** is the expensive one. Each of its 35,937 nodes is a bounded Levenberg–Marquardt solve of the full broadband equation, with the closed-form Jacobian of §9.3. The Studio's solve holds a dye at its bound when the gradient pushes it out (the active-set step of Chapter 11), and a full table for the X-T5 profile with Gold 200 takes about 0.33 s on one core of our test machine. The Studio builds it on the GPU with WebGPU where it can, otherwise in a pool of workers, otherwise on the main thread in slices so the interface stays responsive. It keeps the table until the scanner or the film changes.\n\nThe table is keyed on the analytical estimate, not on raw density. The book found that this tangent keying straightens the function the table must represent and cuts its interpolation error about threefold (§9.7). Where the solve leaves a residual, the densities are outside what the film can produce: the table keeps the bounded answer and flags the pixel as unreachable. The next section explains how the Studio tells apart the reasons a pixel gets flagged.\n\n**The two print tables** cost far less: each node is one pass over the 81 wavelengths, so each rebuilds in about 55 ms on one core, less in the workers or on the GPU. That is the \"rebuild\" cost class of Chapter 1.\n\n## Blank film, below base, out of gamut\n\nOn a real scan, the solve flags pixels for three different reasons, and only one of them is the model's fault. The **Base & gamut** view tells them apart. For each channel it divides the density above the rebate by that channel's noise $\\sigma_k$:\n\n$$\nz_k = \\frac{D_k}{\\sigma_k}, \\qquad D_k = -\\log_{10}\\frac{T_k}{T_k^{\\text{rebate}}} .\n$$\n\n- **Blank film** (blue): some $\\lvert z_k\\rvert \\le 3$. That layer reads at the film's base: it recorded nothing, as in a deep shadow or an underexposed frame. Nothing downstream brings it back; only more exposure on the film would have.\n- **Below base** (amber): some $z_k < -3$. A layer reads lighter than unexposed film by more than the noise explains, which the film cannot do. A flat field fixes uneven light across the scan; failing that, check the rebate box.\n- **Out of gamut** (red): every $z_k > 3$, with a residual above 0.01 D. Every layer has formed dye, yet no dye amounts fit: the scanner profile or the film stock is wrong.\n\nAbout seven in eight pixels that are truly at base are flagged unreachable, because noise pushes at least one of their three channels below zero. Blank film prints as a single tone, the film base's, so it shows in the print window as a spike: every blank pixel lands in the same place on the paper's curve, and no control can separate them again.\n\n**The noise.** $\\sigma_k$ is measured from the rebate box. Each pixel's departure from the mean of its 9 × 9 neighbourhood is taken, and the median departure times 1.4826 gives $\\sigma_k$. A local mean ignores smooth gradients, and unlike differences between neighbours it is not fooled by noise that is correlated over a pixel or two. The Studio measures the noise at two sizes: the view's, and again for the global pass, whose statistics are what the bar and the Print panel report. Without a rebate box, it measures the thin areas of the frame instead. The automatic rebate puts the zero at the frame's lightest pixels, so with it blank film is under-counted.\n\n**On the sample.** The Gold 200 frame is about two stops thinner than a box-speed exposure (Appendix E). With the noise measured at 0.0090, 0.0069 and 0.0122 D, the Studio finds:\n\n- 12.6 % blank film, in the shaded undergrowth on the left and along the bottom;\n- 9.7 % below base;\n- no pixel out of gamut.\n\nThe solve flags 19.3 %. The below-base pixels are 0.03 to 0.07 D lighter than the rebate, too much for noise. The pattern across the frame gives the cause away:\n\n- In the strip of frame nearest the rebate, at the left edge, the deep shadows read at base: 44 to 73 % of it is blank film and at most 13 % is below base.\n- Toward the middle and lower middle, the same kind of shadow reads below base, up to a third of the area.\n\nThe likeliest cause is light that was stronger in the middle of the scan than at its edge: the missing flat field of Appendix E.\n\n> **Try it.** [Show the base map](st:show?view=base) on the sample, and hover a blue and an amber area: the readout names the layers at base and their densities. Then [return to the print](st:show?view=print).\n\n## Why most controls are free\n\nThe print from printing density onwards is a fixed function of three numbers per pixel, the paper exposures $x_k$. Everything that moves light only changes those numbers before the table is read:\n\n| Kind of change | Controls |\n|---|---|\n| an added constant | Exposure, Warmth, Tint, the balance, Roll consistency, Match frame |\n| a spatial weight times a constant | Edge burn, Sky burn |\n| an affine map per layer | Contrast, the colour pads |\n| a 1-D curve per layer | Pre-flash |\n\nNone of these touches the table, so every one is a change of a few numbers in the shader and redraws at once. This is what makes a slider for each printer light practical: the physics is computed once; the light is just where you read it.\n\n## The global pass\n\nSpatial controls need neighbourhoods larger than a pixel. The Studio computes them once per change, at low resolution, in a **global pass**:\n\n- the guided-filter coefficients for the large and mid bases (Chapter 6);\n- the halation blur of the film's red and green exposures (Chapter 5);\n- the bloom blur of the print's bright light, at half the global size (Chapter 8);\n- the frame's statistics: large-area densities for the balance, the print window's histograms, and the mean paper exposures for Match frame.\n\nThe per-pixel pass then reads these, upsampled, so the per-pixel chain stays per-pixel. Every radius of the global pass is a fraction of the frame's long side, so the preview and the full-size export agree at the same viewing size. Sharpness and Grain reduction are the deliberate exceptions: they work on a few pixels of the rendered image, so judge them at 100 % on the size you export (Chapter 8). Grain is the exception that proves the rule: its noise field is sampled through a mip-map, so its variance follows the area law at every scale (Chapter 5).\n\n## Three resolutions\n\nThe Studio works at three sizes:\n\n| Size | Long side | Used for |\n|---|---|---|\n| global | at most 640 px | the global pass: statistics, guided-filter bases, halation and bloom blurs |\n| working | at most 2048 px | the view, snapshots, the ring-around and the working-size export |\n| full | the file's own | the full-size export |\n\nThe full-size export runs the per-pixel chain in tiles of 1024 px, each with an 8 px border of overlap so that sharpening and the bilateral grain reduction see their neighbours at the seams. The tiles read the same global pass as the view, with their coordinates mapped to the whole frame, so a tiled export matches the preview.\n\nIntermediate images are float32 textures where the GPU can filter them, and half-float otherwise.\n\n## Sources\n\nThe Studio opens:\n\n- **TIFF files** (8, 16 or 32-bit; uncompressed, deflate, LZW or PackBits; linear DNG with demosaiced data);\n- **PNG and JPEG files**, decoded from sRGB;\n- **an R, G, B triplet**: three separate exposures, one per LED, as from a camera scan with sequential lights.\n\nThe built-in sample is the real Kodak Gold 200 triplet of Appendix E: a Fujifilm X-T5 under three LEDs, each exposure read through all the photosites of each 6×6 X-Trans block, about 1288 × 860 pixels.\n\nRaw files are not decoded yet. Convert them to linear 16-bit TIFF first, with demosaicing and no tone curve or colour profile.\n\nThe **rebate** is found automatically from a bright percentile of the scan, or set by dragging a box over the film's unexposed edge with the Rebate tool of the Source view. The Crop tool sets the frame the same way.\n\nThe **flat field** is a capture of the light with no film in the holder: one file, or three for a triplet, one per LED. It must be taken with the same lens, aperture, focus and exposure as the scans, and have the same shape as captured. The Studio reduces it to a coarse grid over the sensor: 96 cells along the long side for *Smooth*, which keeps the illumination and the lens fall-off, or 512 for *Fine*, which also keeps small marks on the light. The grid is smoothed, divided by its mean and floored at 5 %, so the dark surround of a film holder cannot blow up the division. Every pixel of the scan, the rebate included, is then divided by the grid at its place on the sensor, so a rebate measured at the edge holds for the middle of the frame too.\n\nThe panel reports the fall-off across the light in density. A flat field is kept for the session only. **Use for all frames** sets it on every frame of the same size, and frames opened after it inherit it. A recipe records its name but not its data. The sample has no flat field: Appendix E's photographer did not capture one.\n\nThe **scanner profile** sets the channel responsivities the solve uses:\n\n- X-T5 + RGB LEDs 678/532/472 (fitted, for the sample);\n- the book's RGB LEDs at 660/530/450;\n- RGB LEDs with custom peaks;\n- the book's white LED with a camera;\n- a Status M densitometer.\n\nThe **film** sets the dyes, the base and the curves.\n\n## Exports\n\nA print exports at the working size or at full size, as:\n\n- PNG at 8 or 16 bits;\n- JPEG;\n- TIFF at 16 bits, inside a zip.\n\nThe 8-bit formats can be encoded for Display P3 as well as sRGB.\n\nEach export can carry its recipe, a JSON file of every control's value plus the source settings: as a second file, or inside the TIFF's zip. **Recipe…** loads one back onto the open frame and reproduces the print. On the hosted page each file is offered through the page and you confirm it before it is saved.\n\n## What is not built yet\n\nThe design document describes more than this Studio contains. Missing for now:\n\n- **Capture:** raw decoding, registration of sequential exposures, bracket merging, capture deconvolution (§8.6, §7.6).\n- **Clean mode:** IR and learned dust detection, fills in negative density.\n- **Local layers:** masks (brush, gradients, density ranges, subject selection), beyond the two burns.\n- **The learned light estimator** of §12.7, updated from your own frames.\n- **Grain:** noise-spectrum-matched grain reduction, and re-grain at the export size.\n- **Output:** ICC soft proofing, output sharpening computed from print size and viewing distance.\n- **Restoration mode** for faded and expired negatives, and the scene branch's ADX exports.\n\nEach is a separate section of the design document, with its maths and references.\n"},{"id":"perf","title":"Making it fast","order":11,"body":"# Making it fast\n\nThe Studio's physics is expensive. One pixel, done honestly, needs a bounded least-squares solve that evaluates an 81-wavelength spectrum several times, then a spectral integral for the paper and another for the print's colour: hundreds of exponentials. A 2048-pixel frame has 2.8 million pixels, and a slider should redraw it in a few hundredths of a second. This chapter shows how the Studio closes that gap, and how to close it for image algorithms of this kind in general.\n\nThere are four tools:\n\n- **Staging:** compute once what does not change per pixel.\n- **The GPU's fragment shaders:** run the per-pixel and per-neighbourhood work.\n- **Workers and WebGPU compute:** run the remaining precomputation on every core.\n- **A better algorithm:** remove work before making it faster.\n\nEvery speed-up in the chapter was checked against the slower version it replaced, and the numbers are given. After it you should be able to look at an image algorithm, find where its time goes, and choose among these tools.\n\nThe measurements were made on the machine that built the Studio: two CPU cores and no GPU, so WebGL and WebGPU ran on SwiftShader, Chromium's software renderer. Times on the CPU are real. GPU times from a software renderer show which passes cost more than others, but not how fast a GPU is. The **Compute** section of the Print panel measures your own machine.\n\n> **Try it.** [Run the benchmark](st:bench) on the sample. It builds the three tables on every backend your browser offers, times them, and compares each with the main thread.\n\n## Where the time goes\n\nThe Studio does three kinds of work, at three frequencies.\n\n| Work | When | Size | Cost here |\n|---|---|---|---|\n| the 3-D tables (dye solve, printing density, print) | the film, scanner, paper or Fade changes | 35,937 nodes each | 0.33 s, 53 ms, 56 ms on one core |\n| the global pass and its statistics | the negative side changes | 640 px | a few ms of readback |\n| the per-pixel chain | every redraw | up to 2048 px | the frame |\n\nThe first row is the expensive physics. The last row is what a slider pays. The rest of the chapter follows the work down this table.\n\n**Measure before you change anything.** Every gain in this chapter came from a measurement that pointed somewhere unexpected. The fixed-length blur loop took 83 % of a frame, and nine tenths of the dye solve's iterations went into a quarter of its nodes, which the Studio flags as unreachable anyway. Guessing would have found neither.\n\n**Measure the right thing.** A browser's GPU runs asynchronously: a draw call returns as soon as it is queued. WebGL's `gl.finish()` is meant to wait for the GPU, but in Chromium, as measured here, it returned at once: timing passes with it reported 2 ms for a frame that took 4.6 s. The Studio's render time used it, and so measured only how long it took to ask. The only reliable wait is to read something back, since a read is ordered after every queued draw. The Studio now reads one texel of the output after each frame. That costs one stall per frame and makes the number true.\n\n## Staging: compute once what does not change\n\n**Staging** moves work from where it repeats to where it does not. A slider changes printer lights, not the film's dyes, so the dye solve need not run again. The question for every stage is what its result depends on.\n\n| Stage | Depends on | Computed |\n|---|---|---|\n| scanner density $\\mathbf D$ | the scan, the rebate | per pixel, per frame |\n| dye amounts $\\mathbf c(\\mathbf a)$ | scanner and film | once, as a 33³ table |\n| printing density $PD(\\mathbf c)$ | film and paper | once, as a 33³ table |\n| paper exposure, curves | printer lights, paper | per pixel, per frame: cheap |\n| print XYZ $(c_p)$ | paper, viewing light, Fade | once, as a 33³ table |\n\nThe tables turn a spectral computation into a texture fetch. Solving per pixel at the working size of the sample (1090 × 754) would be 822,000 solves per frame. The table holds 35,937, about 23 times fewer, and they are solved once per film and scanner rather than once per frame.\n\n**Hardware interpolation.** A 3-D texture with linear filtering returns the trilinear blend of the eight surrounding nodes in one fetch. To read a table of $N$ nodes spanning $[\\ell, h]$ at value $v$, the coordinate must land on texel centres:\n\n$$\nu = \\frac{v - \\ell}{h - \\ell}\\cdot\\frac{N - 1}{N} + \\frac{1}{2N} .\n$$\n\nWithout the half-texel terms, the end nodes sit at texel edges: the first and last half-cells read wrongly and the whole table is stretched by $N/(N-1)$. The Studio's `lut3` writes the same thing as `(u * 32.0 + 0.5) / 33.0`.\n\n**Table size and keying.** Interpolation error falls with the square of the node spacing for smooth functions, and memory grows with the cube of $N$. At $N = 33$ each table is 35,937 × 4 floats, 575 KB. The cheaper gain was in the key: keying the solve on the analytical estimate $\\mathbf a = K^{-1}\\mathbf D$ instead of on $\\mathbf D$ straightens the function the table holds and cut its interpolation error about threefold (§9.7). Choose the key so the tabulated function is close to linear before choosing the size.\n\n**Float formats.** Linear filtering of 32-bit float textures needs the extension `OES_texture_float_linear`. Without it the Studio stores 16-bit floats, which have an 11-bit significand. Near 2.0 they step by 0.002, so densities and dye amounts are stored to about 0.001. That is below what a print shows, and ten times below the 0.01 D at which the solve's residual flags a pixel.\n\n**Fold constants.** Anything that does not depend on the pixel belongs outside the shader:\n\n- the OKLab matrices and their inverses are written into the shader as constants;\n- the print table folds in the observer weights, the normalisation to white and the Bradford adaptation to D65, which is linear once the two whites are fixed;\n- the blur weights are computed on the CPU once per pass (below).\n\n**One-dimensional tables for one-dimensional functions.** The film's and paper's curves are 512-entry 1-D tables. A per-channel function never needs a 3-D table, and 512 entries interpolate a characteristic curve far below visible error.\n\n## The GPU as an image processor\n\nWebGL2 is a drawing API, and the Studio uses it as a programmable image processor. Each **pass** draws one triangle covering the output. The GPU runs a **fragment shader** once per output pixel, and the result goes to a texture instead of the screen. The next pass reads that texture. Rendering to float textures needs `EXT_color_buffer_float`, which the Studio requires.\n\nThe pass graph for one frame:\n\n- **global pass, 640 px:** dyes (and film exposure for halation), printing density, guided-filter coefficients, halation and bloom blurs, statistics;\n- **working size:** dyes, printing density, print, output.\n\n**Gather, not scatter.** A fragment shader writes exactly one pixel, its own, and can read any texel. Algorithms that gather (blurs, lookups, per-pixel maths) map directly. Algorithms that scatter (histograms, sums, sorting) do not. The Studio builds its print-window histogram on the CPU from a small read-back. The alternatives on the GPU are to draw one point per pixel with additive blending, or to reduce by halving the image repeatedly.\n\n**Where to cut passes.** Every pass writes its result to memory and the next reads it back. At 2048 × 1365 a 32-bit RGBA target is 45 MB, so the four per-pixel passes move a few hundred megabytes per frame. A GPU with a few hundred GB/s of bandwidth does that in a few milliseconds (an estimate from the sizes, not a measurement). Fusing passes saves that traffic, so cut a pass only where something needs neighbours. The Studio cuts after the dyes, because grain reduction reads the neighbouring dye amounts. It cuts after the printing density, because Texture reads its neighbours. It cuts after the print, because sharpening reads the neighbouring print. Everything between is fused.\n\n**Arithmetic.** Fragment shaders in WebGL2 have 32-bit `highp` floats. A few habits help:\n\n- `exp2` and `log2` are native, so $10^x$ is written `exp2(3.3219 * x)` and $\\log_{10}$ as `log2(x) * 0.30103`. `pow(x, y)` is `exp2(y * log2(x))` underneath, and undefined for $x < 0$.\n- Prefer `mix`, `step`, `clamp` and `smoothstep` to `if`. Neighbouring pixels run in lockstep, typically 32 or 64 at a time. A branch that goes different ways within such a group runs both sides. A branch on a uniform, which every pixel takes the same way, costs nothing: the Studio's views and its optional operators are uniform branches.\n- Loops should run to the bound they need (below).\n\n## Spatial operators\n\nA per-pixel operator costs one evaluation per pixel. A spatial operator costs one per pixel per tap, so its radius decides its price.\n\n**Separable kernels.** A 2-D Gaussian is the product of two 1-D Gaussians. A horizontal pass and then a vertical pass give the same result with $2(2R+1)$ taps per pixel instead of $(2R+1)^2$: for $R = 26$, 106 taps instead of 2,809. A box filter separates the same way. The Studio's blurs are all separable.\n\n**Loop bounds.** The first version of the Studio's blur looped over a fixed range, $-96 \\le i \\le 96$, and skipped the taps outside the kernel's radius with `continue`. In outline:\n\n```glsl\nfor (int i = -96; i <= 96; i++) {\n  if (i < -R || i > R) continue;\n  float fi = float(i);\n  vec2 k = exp(-0.5 * fi * fi / (r * r));\n  acc += vec4(k.xx, k.yy) * texture(t, uv + dir * fi); w += vec4(k.xx, k.yy);\n}\n```\n\nThat pattern dates from GLSL ES 1.0, which required constant loop bounds. A skipped iteration still costs its loop overhead, and the weights were recomputed with an `exp` per tap per pixel. With every operator on, the blurs took 83 % of a frame in the software renderer. The version now in the Studio loops to the kernel's own radius, which GLSL ES 3.00 allows. It reads the taps at $+i$ and $-i$ together, since the kernel is symmetric, and takes its weights from a uniform array computed once on the CPU:\n\n```glsl\nuniform int R; uniform vec2 kw[97];\nvec4 acc = texture(t, uv) * kw[0].xxyy;\nfor (int i = 1; i <= R; i++) {\n  vec2 d = dir * float(i);\n  acc += (texture(t, uv + d) + texture(t, uv - d)) * kw[i].xxyy;\n}\n```\n\nThe blurs became 3.3 times faster and the frame 2.3 times faster. No output pixel changed by more than one level in 255.\n\n**Two kernels in one pass.** An RGBA texture has four channels. The Studio's guided filter needs box means at two radii, and its halation needs the red and green layers' exposures blurred at two widths. Each such pair runs in one pass, with the weights of one kernel applied to two channels and those of the other to the other two. The loop runs to the larger radius, and each fetch serves both kernels.\n\n**Lower resolution for wide kernels.** The cost of a blur is pixels × taps, and both scale with resolution. Halve the resolution and a kernel of the same physical width costs an eighth.\n\n- **The global pass.** All the large-radius work runs at 640 px on the long side, not at the working size. The radii are fractions of the frame, so the results agree at any size.\n- **Bloom.** The glow is the widest kernel ($\\sigma$ = 3.5 % of the long side, 22 px at 640). It is now thresholded at 640 px and blurred at 320 px. A texel of the half-size target has its centre exactly between four texels of the full-size one, so its single filtered fetch averages them. The downsample needs no pass of its own. The bloom blur's cost fell from about 550 ms to 62 ms in the software renderer. With bloom at 30 % the print changed by 0.02 levels on average and by at most 6 levels in 255.\n\n**Linear-sampling pairs.** Two adjacent taps $i$ and $i+1$ with weights $w_i$ and $w_{i+1}$ can be read with one filtered fetch at offset\n\n$$\ni + \\frac{w_{i+1}}{w_i + w_{i+1}}, \\qquad\\text{weight } w_i + w_{i+1},\n$$\n\nbecause linear filtering blends the two texels in exactly that ratio. That halves the fetches of a 1-D Gaussian. The Studio does not use it, because its packed passes carry two kernels whose pairs would need different offsets.\n\n**Edge-aware smoothing.** The guided filter (Chapter 6) is a handful of box means and per-pixel arithmetic. Box means can be computed at a cost independent of the radius, with running sums along a row or a summed-area table. Fragment shaders cannot keep a running sum, so the Studio pays $O(R)$ per pass and keeps $R$ small by working at 640 px. The **fast guided filter** (He and Sun, 2015) is what makes that sound: the coefficients $a$ and $b$ vary slowly, so they can be computed at low resolution and applied to the full-resolution guide. The Studio computes them at 640 px and applies $aY + b$ per pixel at the working size, so edges keep the working resolution.\n\nA bilateral filter cannot be split this way, because its weights depend on the centre pixel. Its cost is the full window. The Studio's grain reduction uses one only at 5 × 5 pixels, where the window is small.\n\n**Area averages, precomputed.** Grain must look the same at every zoom: its variance falls with the area it is averaged over (Chapter 5). Averaging a noise field over the area a screen pixel covers would need a variable-size window per pixel. A mipmap holds those averages, precomputed at every power-of-two size. The Studio samples a 1024 × 1024 noise texture through its mipmap, and normalises each level by its measured standard deviation.\n\n**Tiles and halos.** A full-size export can exceed what one texture holds. The Studio renders it in tiles of 1024 px. Each tile carries a border of 8 px, the **halo**, which must be at least the largest per-pixel kernel's radius: 1 px for sharpening, 2 for grain reduction and Texture. The wide fields (bases
