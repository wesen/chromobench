<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chromobench M1</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #1b1b1b; color: #ddd; }
      canvas { image-rendering: pixelated; width: 384px; height: 256px; background: #000; border: 1px solid #444; }
      .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      fieldset { border: 1px solid #444; }
      label { display: grid; grid-template-columns: 2em 12em 5em; align-items: center; gap: 6px; }
      pre { font-size: 12px; background: #111; padding: 6px; max-width: 640px; overflow: auto; }
      button { margin: 2px; }
    </style>
  </head>
  <body>
    <h1>Chromobench M1 walking skeleton</h1>
    <p>Open a 16-bit RGB TIFF (e.g. <code>fixtures/synthetic/m1-negative-96x64.tif</code>). Mock engine; the real studio is CHB-009.</p>
    <input id="file" type="file" accept=".tif,.tiff,image/tiff" />
    <div class="row">
      <canvas id="view" width="96" height="64"></canvas>
      <div>
        <div id="controls"></div>
        <div>
          <button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button>
          <select id="mode"><option value="ask" selected>agent: ask</option><option value="auto">agent: auto</option><option value="read-only">agent: read-only</option></select>
        </div>
        <fieldset><legend>Pending agent changes</legend><ul id="pending"></ul></fieldset>
        <div>state hash: <code id="hash">—</code></div>
        <div>status: <span id="status">no frame</span></div>
      </div>
    </div>
    <pre id="why"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
